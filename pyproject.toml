[project]
name = "face-transform"
version = "0.1.1"
description = "Face Transform Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/FaceTransformComfyUI"
Documentation = "https://github.com/AceDataCloud/FaceTransformComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/FaceTransformComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Face Transform by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/FaceTransformComfyUI/main/assets/logo-400.png"
